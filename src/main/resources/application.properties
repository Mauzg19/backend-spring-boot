# Puerto dinámico en Railway
server.port=${PORT:8080}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
# Solo dev — desactivar en prod (log ruidoso + leak SQL)
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DATABASE MYSQL (Railway)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP config
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0

# Stripe
stripe.api.key=${STRIPE_API_KEY}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Facturapi
facturapi.api.key=${FACTURAPI_KEY}

# Reportes — directorio de salida para CSV/TXT
app.reports.path=./reports

# Spring AI - Ollama Configuration
# Modelo con mejor tool calling:
spring.ai.ollama.chat.options.model=llama3.1:8b
# Alternativas: qwen2.5:14b, qwen2.5:7b, phi
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.base-url=http://localhost:11434

# MCP Client — servidores STDIO definidos en mcp-servers.json
# DESHABILITADO: dbhub --readonly ya no es soportado
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers.json
# MCP Client — type: SYNC (bloqueante, compatible con chat endpoint)
spring.ai.mcp.client.type=SYNC

# MCP Server — expone tools internos vía HTTP SSE
spring.ai.mcp.server.transport=WEBMVC_SSE
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Ollama Embedding (para RAG vector store)
spring.ai.ollama.embedding.model=nomic-embed-text:latest
spring.ai.ollama.embedding.options.num-ctx=2048

# DEBUG: Log HTTP requests Spring AI → Ollama para diagnosticar tool calling
logging.level.org.springframework.ai.ollama=TRACE
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.apache.hc.client5.http.wire=DEBUG
logging.level.reactor.netty.http.client=DEBUG
