# Puerto: la plataforma inyecta PORT. En local sigue siendo 5454.
server.port=${PORT:5454}
app.uploads.path=${APP_UPLOADS_PATH:./uploads}
app.reports.path=${APP_REPORTS_PATH:./reports}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
 
# ---------- Base de datos (MySQL) ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.datasource.url=DB_URL=jdbc:mysql://${{MySQL.MYSQLHOST}}:${{MySQL.MYSQLPORT}}/${{MySQL.MYSQLDATABASE}}
spring.datasource.username=${{MySQL.MYSQLUSER}}
spring.datasource.password=${{MySQL.MYSQLPASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.continue-on-error=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
 
# ---------- Stripe ----------
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.checkout.return-url=${STRIPE_CHECKOUT_RETURN_URL:https://proyecto-restaurante-six.vercel.app/}
stripe.checkout.backend-url=${STRIPE_CHECKOUT_BACKEND_URL:http://localhost:5454}
 
# ---------- Correo ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
 
facturapi.api.key=${FACTURAPI_API_KEY:TU_API_KEY_AQUI}
 
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
 
# ---------- Spring AI + MCP ----------
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.top-p=0.9
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.embedding.model=nomic-embed-text:latest
spring.ai.ollama.embedding.options.num-ctx=2048
 
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.transport=WEBMVC_SSE
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialization-timeout-seconds=60
 
# ---------- Logging (DEBUG en local; en prod lo baja application-prod.properties) ----------
logging.level.org.springframework.ai.ollama=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.com.Restaurant=DEBUG
logging.level.org.springframework.web.client.RestClient=TRACE
logging.level.org.springframework.web.client.RestTemplate=TRACE
logging.level.org.apache.hc.client5.http.wire=DEBUG
logging.level.reactor.netty.http.client=DEBUG
 
# ---------- Recompensas ----------
rewards.catalog.starter.points=${REWARDS_STARTER_POINTS:100}
rewards.catalog.starter.discount-cop=${REWARDS_STARTER_DISCOUNT_COP:5000}
rewards.catalog.starter.minimum-order-cop=${REWARDS_STARTER_MINIMUM_ORDER_COP:25000}
rewards.catalog.plus.points=${REWARDS_PLUS_POINTS:200}
rewards.catalog.plus.discount-cop=${REWARDS_PLUS_DISCOUNT_COP:12000}
rewards.catalog.plus.minimum-order-cop=${REWARDS_PLUS_MINIMUM_ORDER_COP:50000}
