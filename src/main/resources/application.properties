# ============================================================================
# Spring AI + MCP Configuration
# ============================================================================
# Arquitectura: Ollama (LLM) + MCP Server (RestaurantTools como herramientas)
# Flujo: Usuario → ChatController → Ollama → Tool calling → RestaurantTools → BD
# ============================================================================

# Spring AI - Ollama LLM Configuration
# Modelo con soporte mejorado para tool calling (function calling)
spring.ai.ollama.chat.options.model=llama3.1:8b
# Alternativas con buen tool calling: qwen2.5:14b, qwen2.5:7b, neural-chat, mistral
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.top-p=0.9
spring.ai.ollama.chat.options.num-ctx=8192

# MCP Server Configuration
# Tu aplicación expone las herramientas (@Tool) vía HTTP SSE
# El LLM (Ollama) puede descubrirlas y usarlas automáticamente
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.transport=WEBMVC_SSE
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# MCP Client Configuration (opcional)
# Si en el futuro necesitas conectar a servidores externos (ej: DBHub para MySQL)
# descomenta la línea siguiente y agrega configuración en mcp-servers.json
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialization-timeout-seconds=60
# spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers.json

# Ollama Embeddings (para RAG/vector store)
spring.ai.ollama.embedding.model=nomic-embed-text:latest
spring.ai.ollama.embedding.options.num-ctx=2048

# Logging - DEBUG para diagnosticar tool calling Ollama ↔ RestaurantTools
logging.level.org.springframework.ai.ollama=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.com.Restaurant=DEBUG
logging.level.org.springframework.web.client.RestClient=TRACE
logging.level.org.springframework.web.client.RestTemplate=TRACE
logging.level.org.apache.hc.client5.http.wire=DEBUG
logging.level.reactor.netty.http.client=DEBUG


